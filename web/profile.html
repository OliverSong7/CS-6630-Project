<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Driver Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

    <header class="top-bar">
        <div class="title">
            <h1>Driver Performance Profile</h1>
        </div>
        <div>
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
        </div>
    </header>

    <main class="profile-layout">

        <aside class="profile-sidebar">
            <div class="photo-container">
                <img id="p-photo" src="" alt="Driver" onerror="this.src='img/placeholder.png'">
            </div>

            <h1 id="p-name">Loading...</h1>
            <h3 id="p-team" class="team-label">...</h3>

            <div class="big-stats-grid">
                <div class="stat-card">
                    <span class="label">Best Lap</span>
                    <span id="p-best" class="value">--</span>
                </div>
                <div class="stat-card">
                    <span class="label">Avg Pace</span>
                    <span id="p-avg" class="value">--</span>
                </div>
                <div class="stat-card">
                    <span class="label">Smoothness</span>
                    <span id="p-cons" class="value">--</span>
                </div>
                <div class="stat-card">
                    <span class="label">Limit Pushing</span>
                    <span id="p-agg" class="value">--</span>
                </div>
            </div>
        </aside>

        <section class="profile-main">
            <h2>Performance Radar</h2>
            <p>Comparing this driver against the session best (100 = Perfect).</p>

            <div id="radar-container" style="width: 100%; height: 500px;"></div>
        </section>

    </main>

    <script src="js/profile.js"></script>
</body>

</html>
